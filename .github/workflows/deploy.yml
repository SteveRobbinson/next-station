on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    
    env:
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}

      TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      TF_VAR_databricks_admin_email: ${{ secrets.DATABRICKS_ADMIN_EMAIL }}
      TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_workspace_name: ${{ vars.WORKSPACE_NAME }}
      TF_VAR_cross_account_role_name: ${{ vars.CROSS_ACCOUNT_ROLE_NAME }}
      TF_VAR_root_bucket_name: ${{ vars.ROOT_BUCKET_NAME }}
      TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
      TF_VAR_public_subnet_cidr: ${{ vars.PUBLIC_SUBNET_CIDR }}
      TF_VAR_private_subnet_a_cidr: ${{ vars.PRIVATE_SUBNET_A_CIDR }}
      TF_VAR_private_subnet_b_cidr: ${{ vars.PRIVATE_SUBNET_B_CIDR }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4

      - name: Deploy infrastructure
        run: |
          terraform -chdir=terraform/core/infrastructure fmt -check
          terraform -chdir=terraform/core/infrastructure init
          terraform -chdir=terraform/core/infrastructure validate
          terraform -chdir=terraform/core/infrastructure apply -auto-approve

      - name: Deploy workspace
        run: |
          terraform -chdir=terraform/core/workspace fmt -check
          terraform -chdir=terraform/core/workspace init
          terraform -chdir=terraform/core/workspace validate
          terraform -chdir=terraform/core/workspace apply -auto-approve

      - name: Deploy workspace-resources
        run: |
          terraform -chdir=terraform/core/workspace-resources fmt -check
          terraform -chdir=terraform/core/workspace-resources init
          terraform -chdir=terraform/core/workspace-resources validate
          terraform -chdir=terraform/core/workspace-resources apply -auto-approve

      - name: Deploy runtime
        run: |
          terraform -chdir=terraform/runtime fmt -check
          terraform -chdir=terraform/runtime init
          terraform -chdir=terraform/runtime validate
          terraform -chdir=terraform/runtime apply -auto-approve

      - name: Export workspace variables
        run: |
          WORKSPACE_HOST="$(terraform -chdir=terraform/core/workspace output -raw workspace_url)"
          SQL_WAREHOUSE_ID="$(terraform -chdir=terraform/core/workspace-resources output -raw sql_warehouse_id)"

          echo "DATABRICKS_HOST=$WORKSPACE_HOST" >> "$GITHUB_ENV"
          echo "BUNDLE_VAR_sql_warehouse_id=$SQL_WAREHOUSE_ID" >> "$GITHUB_ENV"

      - name: Install build tools
        run: pip install build wheel

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Build python wheel
        run: python -m build --wheel

      - name: Deploy bundle
        run: databricks bundle deploy -t prod

      - name: Run bundle
        run: databricks bundle run -t prod

      - name: Destroy runtime infrastructure
        if: always()
        run: terraform -chdir=terraform/runtime destroy -auto-approve
