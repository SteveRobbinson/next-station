bundle:
  name: geo-etl-pipeline

artifacts:
  app_wheel:
    type: whl
    dynamic_version: true
    files:
      - source: dist/next_station-0.1.0-py3-none-any.whl


variables:
  spark_version:
    default: "4.0_2.13"
  sedona_version:
    default: "1.8.1"
  geotools_version:
    default: "1.8.0-33.1"
  databricks_runtime_version:
    default: "17.3.x-scala2.13"
  sql_warehouse_id:
    description: "warehouse ID for dbt related tasks"
  databricks__schema_bronze:
    default: "lukasj47"
  databricks__schema_silver:
    default: "lukasj47_silver"
  aws__s3_bucket_name:
    default: "next-station-bucket"
  aws__s3_railway_stations_file_name:
    default: "railway_stations_poland.json.gz"
  aws__s3_population_grid_file_name:
    default: "population_grid_poland"
  api__base_railway_stations_url:
    default: https://overpass-api.de/api/interpreter/
  api__base_population_grid_url:
    default: https://www.worldpop.org/rest/data/pop/wpgp?iso3=POL
  api__payload_for_railway_stations:
    default: "[out:json][timeout:180]; area['name'='Polska']->.searchArea; (nwr['railway'='station'](area.searchArea); ); out center;"
  api__user_agent:
    default: 'NastepnaStacjaBot/1.0 (contact: lukasjagusz6@gmail.com)'

targets:
  prod:

resources:
  jobs:
    etl_geo_job:
      name: "ETL Geo Job"
      job_clusters:
      - job_cluster_key: "databricks_geo_cluster"
        new_cluster:
          spark_version: ${var.databricks_runtime_version}
          node_type_id: "r5d.large"
          num_workers: 2
          aws_attributes:
            availability: "SPOT_WITH_FALLBACK"
            first_on_demand: 1
          spark_conf:
            "spark.serializer": "org.apache.spark.serializer.KryoSerializer"
            "spark.kryo.registrator": "org.apache.sedona.viz.core.Serde.SedonaVizKryoRegistrator"
            "spark.sql.extensions": "org.apache.sedona.viz.sql.SedonaVizExtensions,org.apache.sedona.sql.SedonaSqlExtensions"
            "spark.kryoserializer.buffer.max": "2047m"
            "spark.sql.sedona.raster.serialization.kryo": "true"
          data_security_mode: "SINGLE_USER"
          spark_env_vars:
            DATABRICKS__SCHEMA_BRONZE: ${var.databricks__schema_bronze}
            DATABRICKS__SCHEMA_SILVER: ${var.databricks__schema_silver}
            AWS__S3_BUCKET_NAME: ${var.aws__s3_bucket_name}
            AWS__S3_RAILWAY_STATIONS_FILE_NAME: ${var.aws__s3_railway_stations_file_name}
            AWS__S3_POPULATION_GRID_FILE_NAME: ${var.aws__s3_population_grid_file_name}
            API__BASE_RAILWAY_STATIONS_URL: ${var.api__base_railway_stations_url}
            API__BASE_POPULATION_GRID_URL: ${var.api__base_population_grid_url}
            API__PAYLOAD_FOR_RAILWAY_STATIONS: ${var.api__payload_for_railway_stations}
            API__USER_AGENT: ${var.api__user_agent}

      tasks:
        ### Railway Stations Pipeline ###
        - task_key: "ingest_railway_stations"
          job_cluster_key: "databricks_geo_cluster"
          python_wheel_task:
            package_name: "next_station"
            entry_point: "ingest_railway_stations"
          libraries:
            - whl: dist/next_station-0.1.0-py3-none-any.whl

        - task_key: "preprocess_railway_stations"
          job_cluster_key: "databricks_geo_cluster"
          depends_on:
            - task_key: "ingest_railway_stations"
          python_wheel_task:
            package_name: "next_station"
            entry_point: "preprocess_railway_stations"
          libraries:
            - whl: dist/next_station-0.1.0-py3-none-any.whl

        - task_key: "railway_stations_silver_A"
          job_cluster_key: "databricks_geo_cluster"
          depends_on:
            - task_key: "preprocess_railway_stations"
          dbt_task:
            project_directory: "./dbt_project"
            warehouse_id: ${var.sql_warehouse_id}
            commands:
              - "dbt deps"
              - "dbt run --select stg_railway_stations"

        - task_key: "railway_stations_silver_B"
          job_cluster_key: "databricks_geo_cluster"
          depends_on:
            - task_key: "railway_stations_silver_A"
          dbt_task:
            project_directory: "./dbt_project"
            warehouse_id: ${var.sql_warehouse_id}
            commands:
              - "dbt run --select int_railway_stations"


        ### Population Grid Pipeline ####
        - task_key: "ingest_population_grid"
          job_cluster_key: "databricks_geo_cluster"
          python_wheel_task:
            package_name: "next_station"
            entry_point: "ingest_population_grid"
          libraries:
            - whl: dist/next_station-0.1.0-py3-none-any.whl

        - task_key: "preprocess_population_grid"
          job_cluster_key: "databricks_geo_cluster"
          depends_on:
            - task_key: "ingest_population_grid"
          python_wheel_task:
            package_name: "next_station"
            entry_point: "preprocess_population_grid"
          libraries:
            - whl: dist/next_station-0.1.0-py3-none-any.whl
            - maven:
                coordinates: "org.apache.sedona:sedona-spark-shaded-${var.spark_version}:${var.sedona_version}"
            - maven:
                coordinates: "org.datasyslab:geotools-wrapper:${var.geotools_version}"
                  
        - task_key: "population_grid_silver_A"
          job_cluster_key: "databricks_geo_cluster"
          depends_on:
            - task_key: "preprocess_population_grid"
          dbt_task:
            project_directory: "./dbt_project"
            warehouse_id: ${var.sql_warehouse_id}
            commands:
              - "dbt deps"
              - "dbt run --select stg_population_grid"

        - task_key: "population_grid_silver_B"
          job_cluster_key: "databricks_geo_cluster"
          depends_on:
            - task_key: "population_grid_silver_A"
          dbt_task:
            project_directory: "./dbt_project"
            warehouse_id: ${var.sql_warehouse_id}
            commands:
              - "dbt run --select ing_population_grid"
